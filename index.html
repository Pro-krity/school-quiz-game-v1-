<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Mission - Educational Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>Math Mission</h1>
    <p class="subtitle">স্কুল শিক্ষার্থীদের জন্য মজার গণিত কুইজ</p>

    <div class="score-box">
      Score: <span id="score">0</span>
    </div>

    <div class="question-box">
      <h2 id="question">Question will appear here</h2>
    </div>

    <div class="options" id="options">
      <!-- JavaScript এখানে answer buttons বসাবে -->
    </div>

    <p id="message"></p>

    <button id="nextBtn" class="next-btn">Next Question</button>
    <button id="restartBtn" class="restart-btn">Restart Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
